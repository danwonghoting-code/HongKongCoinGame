<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港貨幣小英雄 - 邏輯修正版</title>
    <style>
        :root { --main-bg: #fdf5e6; --accent: #ff6b6b; --panel: #ffffff; --btn-blue: #3498db; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--main-bg); margin: 0; overflow: hidden; touch-action: manipulation; }
        
        #menu-screen { position: absolute; width: 100%; height: 100%; background: #ffcc5c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .menu-btn { width: 350px; padding: 25px; margin: 15px; font-size: 2rem; border: none; border-radius: 20px; cursor: pointer; color: white; font-weight: bold; box-shadow: 0 10px 0 #333; }
        .btn-pay { background: var(--accent); }
        .btn-rem { background: var(--btn-blue); }
        .menu-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #333; }

        header { display: flex; justify-content: space-around; padding: 15px; background: var(--accent); color: white; font-size: 1.4rem; border-bottom: 5px solid #e55a5a; font-weight: bold; }
        
        main { display: flex; height: 58vh; padding: 20px; gap: 20px; }
        
        #product-side { flex: 1; background: var(--panel); border-radius: 30px; border: 8px solid #ffcc5c; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 0 #e6b852; }
        .price-tag { font-size: 3.5rem; color: #d32f2f; font-weight: bold; margin-top: 10px; border: 4px solid #000; padding: 5px 20px; border-radius: 12px; background: #fffbe6; }
        #product-display { font-size: 110px; }

        #payment-container { flex: 1.5; display: flex; flex-direction: column; gap: 10px; }
        #coin-area { flex: 1; background: rgba(255,255,255,0.85); border: 5px dashed #aaa; border-radius: 30px; display: flex; flex-wrap: wrap; align-content: flex-start; padding: 25px; overflow-y: auto; }
        
        #message-box { height: 80px; background: #333; color: #fff; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; padding: 0 20px; text-align: center; border: 3px solid #ffcc5c; }
        
        .coin-img { width: 105px; height: 105px; margin: 8px; animation: pop 0.3s ease; cursor: pointer; filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.2)); }
        .coin-deleted { opacity: 0.15; filter: grayscale(1) blur(2px); transform: scale(0.9); }

        #answer-input-zone { display: none; background: #fff; padding: 15px; border-radius: 15px; align-items: center; justify-content: center; gap: 10px; font-size: 1.6rem; border: 3px solid var(--btn-blue); font-weight: bold; }
        input { width: 70px; font-size: 1.8rem; padding: 5px; text-align: center; border-radius: 8px; border: 2px solid #333; background: #ffffd2; }

        #coin-tray { height: 26vh; background: #ececec; border-top: 8px solid #ccc; display: flex; justify-content: center; align-items: center; gap: 12px; padding: 0 20px; }
        .tray-coin-btn { background: none; border: none; padding: 0; cursor: pointer; }
        .tray-coin { width: 95px; height: 95px; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-left: 20px; }
        .btn { padding: 15px 30px; font-size: 1.3rem; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; color: white; min-width: 150px; }
        .confirm-btn { background: #4caf50; box-shadow: 0 6px 0 #388e3c; }
        .clear-btn { background: #9e9e9e; box-shadow: 0 6px 0 #757575; }
        .back-btn { background: #555; position: absolute; top: 15px; left: 15px; }

        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="menu-screen">
    <h1 style="font-size: 3.5rem; color: #333; margin-bottom: 40px;">💰 香港貨幣小英雄</h1>
    <button class="menu-btn btn-pay" onclick="startGame('PAY')">超市付款遊戲</button>
    <button class="menu-btn btn-rem" onclick="startGame('REM')">剩餘款項挑戰</button>
</div>

<header id="game-header" style="display:none;">
    <button class="btn back-btn" onclick="location.reload()">返回主頁</button>
    <span>模式: <span id="mode-text">---</span></span>
    <span>第 <span id="round-num">1</span>/10 題</span>
    <span>得分: <span id="score-val">0</span></span>
    <span id="level-tag" style="background:#fff; color:#ff6b6b; padding:2px 10px; border-radius:10px;">難度: 初級</span>
</header>

<main id="game-main" style="display:none;">
    <div id="product-side">
        <div id="product-display">🍎</div>
        <div class="price-tag" id="price-display">$0.00</div>
    </div>
    
    <div id="payment-container">
        <div id="coin-area"></div>
        <div id="answer-input-zone">
            還餘 <input type="number" id="ans-dlr"> 元 <input type="number" id="ans-cnt"> 角
        </div>
        <div id="message-box">🍎 店長：請準備！</div>
    </div>
</main>

<div id="coin-tray" style="display:none;">
    <div id="tray-coins-container" style="display: flex; gap: 10px;">
        <button class="tray-coin-btn" onclick="addCoin(100, '10_dollar.png')"><img src="10_dollar.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(50, '5_dollar.png')"><img src="5_dollar.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(20, '2_dollar.png')"><img src="2_dollar.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(10, '1_dollar.png')"><img src="1_dollar.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(5, '50_cent.png')"><img src="50_cent.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(2, '20_cent.png')"><img src="20_cent.png" class="tray-coin"></button>
        <button class="tray-coin-btn" onclick="addCoin(1, '10_cent.png')"><img src="10_cent.png" class="tray-coin"></button>
    </div>
    <div class="btn-group">
        <button class="btn confirm-btn" onclick="checkAnswer()">確認答案</button>
        <button class="btn clear-btn" onclick="resetRound()">重新清除</button>
    </div>
</div>

<script>
    let currentGameMode = ""; 
    let round = 0, score = 0, isProcessing = false;
    let currentPaidCents = 0, currentCoinsUsedCount = 0;
    let walletCoins = [], deletedWalletIndices = new Set();
    let questionList = [];

    const coinData = [
        { val: 100, img: '10_dollar.png' }, { val: 50, img: '5_dollar.png' },
        { val: 20, img: '2_dollar.png' }, { val: 10, img: '1_dollar.png' },
        { val: 5, img: '50_cent.png' }, { val: 2, img: '20_cent.png' },
        { val: 1, img: '10_cent.png' }
    ];

    function formatPriceToText(cents) {
        let d = Math.floor(cents / 10), c = cents % 10;
        let res = "";
        if(d > 0) res += d + "元";
        if(c > 0) res += c + "角";
        return res === "" ? "0元" : res;
    }

    function startGame(mode) {
        currentGameMode = mode;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-header').style.display = 'flex';
        document.getElementById('game-main').style.display = 'flex';
        document.getElementById('coin-tray').style.display = 'flex';
        document.getElementById('mode-text').innerText = mode === 'PAY' ? '超市付款' : '剩餘款項';
        document.getElementById('tray-coins-container').style.display = mode === 'PAY' ? 'flex' : 'none';
        document.getElementById('answer-input-zone').style.display = mode === 'REM' ? 'flex' : 'none';
        round = 0; score = 0;
        generateQuestions();
        startRound();
    }

    function generateQuestions() {
        questionList = []; let used = new Set();
        for(let i=0; i<10; i++) {
            let p;
            do {
                if(i < 3) p = (Math.floor(Math.random()*9)+1)*10;
                else if(i < 6) p = (Math.floor(Math.random()*17)+3)*5;
                else p = Math.floor(Math.random()*98)+2;
            } while(used.has(p));
            used.add(p); questionList.push(p);
        }
    }

    function startRound() {
        isProcessing = false; currentPaidCents = 0; currentCoinsUsedCount = 0;
        deletedWalletIndices.clear();
        document.getElementById('coin-area').innerHTML = "";
        document.getElementById('ans-dlr').value = ""; document.getElementById('ans-cnt').value = "";
        
        let price = questionList[round];
        document.getElementById('price-display').innerText = `$${Math.floor(price/10)}.${price%10}0`;
        document.getElementById('round-num').innerText = round + 1;
        document.getElementById('score-val').innerText = score;
        document.getElementById('level-tag').innerText = "難度: " + (round < 3 ? "初級" : (round < 6 ? "中級" : "高級"));
        document.getElementById('product-display').innerText = ["🍎","🥛","🍞","✏️","🍰","🍌","🥤","🍦","🍭","🍇"][round];

        if (currentGameMode === 'REM') generateCorrectWallet(price);
        updateMessage();
    }

    // --- 關鍵修正：生成包含「正確最少硬幣」的錢包 ---
    function generateCorrectWallet(price) {
        walletCoins = [];
        let tempPrice = price;
        
        // 1. 強制加入付這筆錢「最少硬幣組合」
        coinData.forEach(c => {
            let count = Math.floor(tempPrice / c.val);
            for(let i=0; i<count; i++) { walletCoins.push({...c}); }
            tempPrice %= c.val;
        });

        // 2. 加入隨機額外硬幣（剩餘款項）
        let extraCount = Math.floor(Math.random() * 3) + 2; // 隨機加 2-4 個
        for(let i=0; i<extraCount; i++) {
            walletCoins.push({...coinData[Math.floor(Math.random() * coinData.length)]});
        }

        // 3. 隨機打亂順序，不讓付錢的硬幣排在一起
        walletCoins.sort(() => Math.random() - 0.5);

        // 4. 渲染
        walletCoins.forEach((c, idx) => {
            let img = document.createElement('img');
            img.src = c.img; img.className = 'coin-img';
            img.onclick = () => toggleDeleteCoin(idx, img);
            document.getElementById('coin-area').appendChild(img);
        });
    }

    function toggleDeleteCoin(idx, element) {
        if(isProcessing || currentGameMode !== 'REM') return;
        if(deletedWalletIndices.has(idx)) {
            deletedWalletIndices.delete(idx);
            element.classList.remove('coin-deleted');
            currentPaidCents -= walletCoins[idx].val;
            currentCoinsUsedCount--;
        } else {
            deletedWalletIndices.add(idx);
            element.classList.add('coin-deleted');
            currentPaidCents += walletCoins[idx].val;
            currentCoinsUsedCount++;
        }
    }

    function addCoin(val, img) {
        if(isProcessing || currentGameMode !== 'PAY') return;
        currentPaidCents += val; currentCoinsUsedCount++;
        let el = document.createElement('img');
        el.src = img; el.className = 'coin-img';
        document.getElementById('coin-area').appendChild(el);
    }

    function checkAnswer() {
        if(isProcessing) return;
        let target = questionList[round];
        
        if(currentPaidCents !== target) {
            showMessage("❌ 金額不正確喔！請再數一次。", "#ff6b6b");
            return;
        }

        let temp = target, minNeeded = 0;
        coinData.forEach(v => { minNeeded += Math.floor(temp / v.val); temp %= v.val; });
        if(currentCoinsUsedCount !== minNeeded) {
            showMessage("⚠️ 金額對了，但這不是「最少硬幣」組合喔！", "#ffcc5c");
            return;
        }

        if(currentGameMode === 'REM') {
            let totalVal = walletCoins.reduce((a, b) => a + b.val, 0);
            let realRem = totalVal - target;
            let userRem = (parseInt(document.getElementById('ans-dlr').value) || 0) * 10 + (parseInt(document.getElementById('ans-cnt').value) || 0);
            if(userRem !== realRem) {
                showMessage("❌ 付款正確，但「還餘」多少錢算錯了！", "#ff6b6b");
                return;
            }
        }

        isProcessing = true; score += 10;
        showMessage("✅ 太棒了！完全正確！", "#4caf50");
        setTimeout(() => {
            round++;
            if(round < 10) startRound();
            else { showMessage("🎉 完成挑戰！總分：" + score, "#ffcc5c"); setTimeout(() => location.reload(), 4000); }
        }, 1500);
    }

    function updateMessage() {
        let price = questionList[round];
        if (round < 5) {
            let txt = "🍎 店長：這件商品是 " + formatPriceToText(price) + "。";
            txt += (currentGameMode === 'REM' ? " 請刪掉付錢用的最少硬幣，再算餘額。" : " 請放進最少數量的硬幣吧！");
            showMessage(txt);
        } else {
            showMessage(currentGameMode === 'PAY' ? "🛒 請用最少硬幣付款。" : "🛒 刪除硬幣並計算餘額。");
        }
    }

    function resetRound() { startRound(); }
    function showMessage(msg, color="#ffffff") { const b = document.getElementById('message-box'); b.innerText = msg; b.style.color = color; }
</script>
</body>
</html>
